<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Type · Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:18px 24px; background: var(--surface-1); }
  .row { display:flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--hairline-soft); }
  .row:last-child { border-bottom: none; }
  .label { font-family: var(--font-mono); font-size:11px; color: var(--ink-3); width: 110px; flex-shrink:0; }
  .sample { color: var(--ink-1); }
</style></head>
<body>
  <div class="row"><span class="label">h1 · 24/500</span><span class="sample dt-h1">5월 11일 토요일</span></div>
  <div class="row"><span class="label">h2 · 20/500</span><span class="sample dt-h2">2019년 06월</span></div>
  <div class="row"><span class="label">h3 · 17/500</span><span class="sample dt-h3">DAILYTODO TODOLIST</span></div>
  <div class="row"><span class="label">task · 15/500</span><span class="sample dt-task"><span class="dt-task-prefix">(독서)</span> 도서관에서 책 빌리기</span></div>
  <div class="row"><span class="label">body · 16/400</span><span class="sample dt-body">2019년 05월 11일 토요일에 시작합니다</span></div>
  <div class="row"><span class="label">secondary · 13</span><span class="sample dt-secondary">간략히 보기</span></div>
  <div class="row"><span class="label">caps · 12/500</span><span class="sample dt-caps">DAILYTODO</span></div>
  <div class="row"><span class="label">meta · 12/400</span><span class="sample dt-meta">1분 전</span></div>
</body></html>
