<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background: var(--surface-1); display:flex; gap:32px; align-items:center; }
  .meta { display:flex; flex-direction:column; gap:4px; }
  .meta .label { font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-2); }
  .meta .spec  { font-family: var(--font-mono); font-size:11px; color: var(--ink-3); line-height:1.6; }
</style></head>
<body>
  <div class="dt-clock">1:38</div>
  <div class="meta">
    <span class="label">Display · Clock</span>
    <span class="spec">SF Pro Display · 80px · 300 light</span>
    <span class="spec">letter-spacing −0.04em</span>
    <span class="spec">Used only for lock-screen clock</span>
  </div>
</body></html>
