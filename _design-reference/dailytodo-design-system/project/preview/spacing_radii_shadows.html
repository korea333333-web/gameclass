<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Spacing · Radii · Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:18px 24px; background: var(--surface-1); display:flex; flex-direction:column; gap:14px; }
  .group { display:flex; align-items: center; gap: 10px; }
  .label { font-family: var(--font-mono); font-size:11px; color: var(--ink-3); width: 80px; }
  .box { background: var(--surface-3); height: 36px; display:flex; align-items:center; justify-content:center;
         border: 1px solid var(--hairline); font-family: var(--font-mono); font-size:10px; color: var(--ink-2); }
  .pill { background: var(--ink-1); color: var(--surface-3); height: 24px; }
</style></head>
<body>
  <div class="group">
    <span class="label">radius</span>
    <div class="box" style="border-radius:6px; width:60px;">6</div>
    <div class="box" style="border-radius:10px; width:80px;">10</div>
    <div class="box" style="border-radius:14px; width:100px;">14</div>
    <div class="box" style="border-radius:20px; width:120px;">20</div>
    <div class="box pill" style="border-radius:9999px; width:80px;">pill</div>
  </div>
  <div class="group">
    <span class="label">shadow</span>
    <div class="box" style="border-radius:14px; width:90px; box-shadow:none; border: 1px solid var(--hairline);">none</div>
    <div class="box" style="border-radius:14px; width:90px; box-shadow: var(--shadow-card);">card</div>
    <div class="box" style="border-radius:14px; width:90px; box-shadow: var(--shadow-fab);">fab</div>
    <div class="box" style="border-radius:14px; width:90px; box-shadow: var(--shadow-sheet);">sheet</div>
  </div>
  <div class="group">
    <span class="label">space</span>
    <div style="display:flex; align-items:flex-end; gap:4px;">
      <div style="background:var(--ink-3); width:4px; height:4px;"></div>
      <div style="background:var(--ink-3); width:8px; height:8px;"></div>
      <div style="background:var(--ink-3); width:12px; height:12px;"></div>
      <div style="background:var(--ink-3); width:16px; height:16px;"></div>
      <div style="background:var(--ink-3); width:20px; height:20px;"></div>
      <div style="background:var(--ink-3); width:24px; height:24px;"></div>
      <div style="background:var(--ink-3); width:32px; height:32px;"></div>
      <div style="background:var(--ink-3); width:40px; height:40px;"></div>
    </div>
    <span class="label" style="margin-left:8px;">4 → 40px</span>
  </div>
</body></html>
