<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Components · Notification card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--surface-0); }
  .notif {
    background: var(--surface-3);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: var(--shadow-card);
    margin-bottom: 8px;
  }
  .head {
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .src { display:flex; align-items:center; gap: 8px; }
  .src img { width: 14px; height: 14px; opacity: 0.55; }
  .title { font-size: 14px; font-weight: 500; color: var(--ink-1); margin: 0 0 2px; }
  .body  { font-size: 13px; color: var(--ink-2); margin: 0; }
</style></head>
<body>
  <div class="notif">
    <div class="head">
      <div class="src">
        <img src="../assets/icons/list.svg">
        <span class="dt-caps">DAILYTODO</span>
      </div>
      <span class="dt-meta">1분 전</span>
    </div>
    <p class="title">(독서) 도서관에서 책 빌리기</p>
    <p class="body">2019년 05월 11일 토요일에 시작합니다</p>
  </div>
  <div class="notif">
    <div class="head">
      <div class="src">
        <img src="../assets/icons/list.svg">
        <span class="dt-caps">DAILYTODO</span>
      </div>
      <span class="dt-meta">1분 전</span>
    </div>
    <p class="title">(독서) 독후감 제출하기</p>
    <p class="body">2019년 05월 13일 월요일에 시작합니다</p>
  </div>
</body></html>
