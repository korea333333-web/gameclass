<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>Brand · Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 28px; background: var(--surface-1);
         display:flex; flex-direction: column; gap: 20px; }
  .brand-row { display:flex; align-items: center; gap: 14px; }
  .wordmark-en {
    font-size: 22px; font-weight: 500;
    letter-spacing: 0.1em; color: var(--ink-1);
  }
  .wordmark-ko {
    font-size: 22px; font-weight: 500;
    letter-spacing: -0.01em; color: var(--ink-1);
  }
  .wordmark-ko .sep { color: var(--ink-3); margin: 0 6px; }
  .wordmark-ko .sub { color: var(--ink-2); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: var(--surface-3); border: 1px solid var(--hairline);
    border-radius: 6px;
  }
  .chip img { width: 14px; height: 14px; opacity: 0.55; }
  .chip-text { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--ink-2); }
</style></head>
<body>
  <div class="brand-row">
    <span class="wordmark-en">DAILYTODO</span>
  </div>
  <div class="brand-row">
    <span class="wordmark-ko">투두<span class="sep">·</span><span class="sub">오늘의 할일</span></span>
  </div>
  <div class="brand-row">
    <span class="chip"><img src="../assets/icons/list.svg"><span class="chip-text">DAILYTODO</span></span>
    <span class="chip"><img src="../assets/icons/list.svg"><span class="chip-text">DAILYTODO TODOLIST WIDGET</span></span>
  </div>
</body></html>
