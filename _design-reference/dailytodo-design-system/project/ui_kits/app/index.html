<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyTodo · iOS UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body {
    margin: 0; padding: 40px 20px; min-height: 100vh;
    background: #ECE6DD;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    font-family: var(--font-sans);
  }
  .header { text-align: center; max-width: 560px; }
  .header h1 {
    font-size: 22px; font-weight: 500; margin: 0 0 6px;
    color: #3D3530; letter-spacing: -0.01em;
  }
  .header p { font-size: 13px; color: #6E635B; margin: 0; line-height: 1.6; }
  .stage {
    display: flex; flex-wrap: wrap; gap: 28px; justify-content: center;
    align-items: flex-start;
  }
  .frame-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .frame-wrap .label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: #6E635B;
  }
  .phone {
    position: relative;
    width: 320px; height: 660px;
    background: #FAF7F2; border-radius: 44px;
    box-shadow: 0 30px 60px rgba(60,40,30,0.18), 0 0 0 1px rgba(60,40,30,0.10);
    overflow: hidden;
  }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 28px; border-radius: 18px; background: #3D3530;
    z-index: 50;
  }
  .home-indicator {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 4px; border-radius: 2px;
    background: rgba(61,53,48,0.20); z-index: 60;
  }
  .ios-status {
    position: absolute; top: 0; left: 0; right: 0; height: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 26px 0; font-family: "SF Pro Display", -apple-system, system-ui;
    font-size: 14px; font-weight: 600; color: #3D3530; z-index: 40;
  }
  .ios-status .ind { display: flex; gap: 5px; align-items: center; }
  .ios-status .ind svg { display: block; }
</style>
</head>
<body>
  <div class="header">
    <h1>투두 · 오늘의 할일 — iOS UI Kit</h1>
    <p>Three core surfaces. Tap notifications, status marks, and buttons to interact.</p>
  </div>
  <div class="stage" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="LockScreen.jsx"></script>
<script type="text/babel" src="WidgetView.jsx"></script>
<script type="text/babel" src="AppView.jsx"></script>

<script type="text/babel">
const { useState } = React;

function StatusBar() {
  return (
    <div className="ios-status">
      <span>1:24</span>
      <div className="ind">
        <svg width="17" height="11" viewBox="0 0 17 11">
          <rect x="0" y="6" width="3" height="5" rx="0.6" fill="#3D3530"/>
          <rect x="4.5" y="4" width="3" height="7" rx="0.6" fill="#3D3530"/>
          <rect x="9" y="2" width="3" height="9" rx="0.6" fill="#3D3530"/>
          <rect x="13.5" y="0" width="3" height="11" rx="0.6" fill="#3D3530"/>
        </svg>
        <svg width="16" height="11" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#3D3530"/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#3D3530"/>
          <circle cx="8.5" cy="10.5" r="1.5" fill="#3D3530"/>
        </svg>
        <svg width="24" height="12" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#3D3530" strokeOpacity="0.4" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill="#3D3530"/>
        </svg>
      </div>
    </div>
  );
}

function Frame({ label, children }) {
  return (
    <div className="frame-wrap">
      <span className="label">{label}</span>
      <div className="phone">
        <div className="island"></div>
        <StatusBar />
        {children}
        <div className="home-indicator"></div>
      </div>
    </div>
  );
}

const SAMPLE = [
  { prefix: '미적1', title: '기출의 미래: 함수의 극한 오답 정리', mark: 'O' },
  { prefix: '기벡', title: '기출의 미래: 평면에서 풀기', mark: 'X' },
  { prefix: '국어', title: '2019년 6월 모의고사 풀고 오답 정리', mark: '→' },
  { prefix: '영어', title: '6월 모의고사 풀고 오답 정리', mark: '△' },
  { prefix: '영어', title: '영어단어 DAY 16 암기', mark: 'X' },
  { prefix: '한국사', title: '06강 고려의 경제 사회와 문화 강의 듣기', mark: 'O' },
  { prefix: '독서', title: '도서관에서 책 빌리기', mark: 'O' },
  { prefix: '선물', title: '엄마 생일 선물 주문하기', mark: '△' },
];

const CYCLE = ['O', 'X', '△', '→'];

function App() {
  const [tasks, setTasks] = useState(SAMPLE);

  const cycle = (i) => {
    setTasks(t => t.map((row, j) =>
      j === i ? { ...row, mark: CYCLE[(CYCLE.indexOf(row.mark) + 1) % CYCLE.length] } : row
    ));
  };

  return (
    <>
      <Frame label="Lock Screen">
        <LockScreen
          time="1:38"
          date="5월 11일 토요일"
          notifications={[
            { title: '(독서) 도서관에서 책 빌리기', body: '2019년 05월 11일 토요일에 시작합니다' },
            { title: '(독서) 독후감 제출하기', body: '2019년 05월 13일 월요일에 시작합니다' },
          ]}
        />
      </Frame>

      <Frame label="Notification Center · Widget">
        <WidgetView
          time="1:24"
          date="5월 11일 토요일"
          tasks={tasks.slice(0, 8)}
        />
      </Frame>

      <Frame label="In-App · Calendar + Tasks">
        <AppView
          tasks={tasks}
          onTaskCycle={cycle}
          onAddTask={() => alert('할 일 추가')}
        />
      </Frame>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
